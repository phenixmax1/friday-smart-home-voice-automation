<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width,initial-scale=1'><title>Lab Automation</title><style>*{box-sizing:border-box;}html{scroll-behavior:auto;}body{font-family:Arial,sans-serif;margin:0;padding:15px;background:#f2f2f2;}h1{text-align:center;margin:10px 0 20px;}h2{margin-top:5px;}section{background:white;padding:15px;margin-bottom:20px;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.12);}.masterButtons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}.zoneButtons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:15px;}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}button{border:none;border-radius:8px;padding:14px 8px;font-size:15px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;}.master{background:#333;color:white;min-height:60px;}.zoneOn{background:#168a35;color:white;}.zoneOff{background:#b52b2b;color:white;}.relay{min-height:65px;}.relay.on{background:#21a366;color:white;}.relay.off{background:#ddd;color:#222;}.curtainRow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;align-items:center;margin:12px 0;}.curtainName{font-size:17px;font-weight:bold;}.upBtn{background:#168a35;color:white;font-size:17px;min-height:60px;}.downBtn{background:#b52b2b;color:white;font-size:17px;min-height:60px;}.allCurtainButtons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px;}.allUp{background:#168a35;color:white;font-size:18px;min-height:65px;}.allDown{background:#b52b2b;color:white;font-size:18px;min-height:65px;}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);}.masterButtons{grid-template-columns:1fr;}.curtainRow{grid-template-columns:1fr 1fr;}.curtainName{grid-column:1/-1;text-align:center;}}</style><script>function keepPosition(){return window.scrollY||window.pageYOffset;}function relay(z,r){let y=keepPosition();fetch('/relay?z='+z+'&r='+r).then(()=>{window.scrollTo(0,y);setTimeout(()=>location.reload(),120);}).catch(()=>{window.scrollTo(0,y);});}function zoneControl(z,s){let y=keepPosition();fetch('/zone?z='+z+'&s='+s).then(()=>{window.scrollTo(0,y);setTimeout(()=>location.reload(),120);}).catch(()=>{window.scrollTo(0,y);});}function masterControl(type,s){let y=keepPosition();fetch('/master?type='+type+'&s='+s).then(()=>{window.scrollTo(0,y);setTimeout(()=>location.reload(),120);}).catch(()=>{window.scrollTo(0,y);});}let curtainTimers={};let curtainActive={};function startCurtain(c,a,btn){event.preventDefault();if(curtainActive[c])return;curtainActive[c]=true;btn.setPointerCapture(event.pointerId);fetch('/curtain?c='+c+'&a='+a);curtainTimers[c]=setInterval(()=>{if(curtainActive[c])fetch('/curtain?c='+c+'&a='+a);},200);}function stopCurtain(c,btn){event.preventDefault();if(!curtainActive[c])return;curtainActive[c]=false;clearInterval(curtainTimers[c]);fetch('/curtain?c='+c+'&a=0');}function pointerLeave(c,btn){if(curtainActive[c]){stopCurtain(c,btn);}}let allCurtainTimer=null;let allCurtainActive=false;function startAllCurtains(a,btn){event.preventDefault();if(allCurtainActive)return;allCurtainActive=true;btn.setPointerCapture(event.pointerId);fetch('/allcurtains?a='+a);allCurtainTimer=setInterval(()=>{if(allCurtainActive)fetch('/allcurtains?a='+a);},200);}function stopAllCurtains(btn){event.preventDefault();if(!allCurtainActive)return;allCurtainActive=false;clearInterval(allCurtainTimer);fetch('/allcurtains?a=0');}</script></head><body><h1>LAB AUTOMATION</h1><section><h2>MASTER CONTROL</h2><div class='masterButtons'><button class='master' onclick='masterControl("lights",1)'>ALL LIGHTS ON</button><button class='master' onclick='masterControl("lights",0)'>ALL LIGHTS OFF</button><button class='master' onclick='masterControl("fans",1)'>ALL FANS ON</button><button class='master' onclick='masterControl("fans",0)'>ALL FANS OFF</button><button class='master' onclick='masterControl("all",1)'>ALL FANS + LIGHTS ON</button><button class='master' onclick='masterControl("all",0)'>ALL FANS + LIGHTS OFF</button></div></section><section><h2>ZONE A</h2><div class='zoneButtons'><button class='zoneOn' onclick='zoneControl(1,1)'>ALL ZONE A ON</button><button class='zoneOff' onclick='zoneControl(1,0)'>ALL ZONE A OFF</button></div><div class='grid'><button class='relay on' onclick='relay(1,1)'>Relay 1<br><small>ON</small></button><button class='relay on' onclick='relay(1,2)'>Relay 2<br><small>ON</small></button><button class='relay on' onclick='relay(1,3)'>Relay 3<br><small>ON</small></button><button class='relay on' onclick='relay(1,4)'>Relay 4<br><small>ON</small></button><button class='relay on' onclick='relay(1,5)'>Relay 5<br><small>ON</small></button><button class='relay on' onclick='relay(1,6)'>Relay 6<br><small>ON</small></button><button class='relay on' onclick='relay(1,7)'>Relay 7<br><small>ON</small></button><button class='relay on' onclick='relay(1,8)'>Relay 8<br><small>ON</small></button><button class='relay on' onclick='relay(1,9)'>Relay 9<br><small>ON</small></button><button class='relay on' onclick='relay(1,10)'>Relay 10<br><small>ON</small></button><button class='relay on' onclick='relay(1,11)'>Relay 11<br><small>ON</small></button><button class='relay on' onclick='relay(1,12)'>Relay 12<br><small>ON</small></button></div></section><section><h2>ZONE B</h2><div class='zoneButtons'><button class='zoneOn' onclick='zoneControl(2,1)'>ALL ZONE B ON</button><button class='zoneOff' onclick='zoneControl(2,0)'>ALL ZONE B OFF</button></div><div class='grid'><button class='relay off' onclick='relay(2,1)'>Fan 1<br><small>OFF</small></button><button class='relay off' onclick='relay(2,2)'>Fan 2<br><small>OFF</small></button><button class='relay off' onclick='relay(2,3)'>Fan 3<br><small>OFF</small></button><button class='relay on' onclick='relay(2,4)'>Light 1<br><small>ON</small></button><button class='relay on' onclick='relay(2,5)'>Light 2<br><small>ON</small></button><button class='relay on' onclick='relay(2,6)'>Light 3<br><small>ON</small></button><button class='relay on' onclick='relay(2,7)'>Light 4<br><small>ON</small></button><button class='relay on' onclick='relay(2,8)'>Light 5<br><small>ON</small></button></div></section><section><h2>ZONE C</h2><div class='zoneButtons'><button class='zoneOn' onclick='zoneControl(3,1)'>ALL ZONE C ON</button><button class='zoneOff' onclick='zoneControl(3,0)'>ALL ZONE C OFF</button></div><div class='grid'><button class='relay on' onclick='relay(3,1)'>Relay 1<br><small>ON</small></button><button class='relay on' onclick='relay(3,2)'>Relay 2<br><small>ON</small></button><button class='relay on' onclick='relay(3,3)'>Relay 3<br><small>ON</small></button><button class='relay on' onclick='relay(3,4)'>Relay 4<br><small>ON</small></button><button class='relay on' onclick='relay(3,5)'>Relay 5<br><small>ON</small></button><button class='relay on' onclick='relay(3,6)'>Relay 6<br><small>ON</small></button><button class='relay on' onclick='relay(3,7)'>Relay 7<br><small>ON</small></button><button class='relay on' onclick='relay(3,8)'>Relay 8<br><small>ON</small></button></div></section><section><h2>CURTAIN CONTROL</h2><div class='curtainRow'><span class='curtainName'>Curtain 1</span><button class='upBtn' onpointerdown='startCurtain(1,1,this)' onpointerup='stopCurtain(1,this)' onpointercancel='stopCurtain(1,this)' onpointerleave='pointerLeave(1,this)'>â–² UP</button><button class='downBtn' onpointerdown='startCurtain(1,2,this)' onpointerup='stopCurtain(1,this)' onpointercancel='stopCurtain(1,this)' onpointerleave='pointerLeave(1,this)'>â–¼ DOWN</button></div><div class='curtainRow'><span class='curtainName'>Curtain 2</span><button class='upBtn' onpointerdown='startCurtain(2,1,this)' onpointerup='stopCurtain(2,this)' onpointercancel='stopCurtain(2,this)' onpointerleave='pointerLeave(2,this)'>â–² UP</button><button class='downBtn' onpointerdown='startCurtain(2,2,this)' onpointerup='stopCurtain(2,this)' onpointercancel='stopCurtain(2,this)' onpointerleave='pointerLeave(2,this)'>â–¼ DOWN</button></div><div class='curtainRow'><span class='curtainName'>Curtain 3</span><button class='upBtn' onpointerdown='startCurtain(3,1,this)' onpointerup='stopCurtain(3,this)' onpointercancel='stopCurtain(3,this)' onpointerleave='pointerLeave(3,this)'>â–² UP</button><button class='downBtn' onpointerdown='startCurtain(3,2,this)' onpointerup='stopCurtain(3,this)' onpointercancel='stopCurtain(3,this)' onpointerleave='pointerLeave(3,this)'>â–¼ DOWN</button></div><div class='curtainRow'><span class='curtainName'>Curtain 4</span><button class='upBtn' onpointerdown='startCurtain(4,1,this)' onpointerup='stopCurtain(4,this)' onpointercancel='stopCurtain(4,this)' onpointerleave='pointerLeave(4,this)'>â–² UP</button><button class='downBtn' onpointerdown='startCurtain(4,2,this)' onpointerup='stopCurtain(4,this)' onpointercancel='stopCurtain(4,this)' onpointerleave='pointerLeave(4,this)'>â–¼ DOWN</button></div><div class='allCurtainButtons'><button class='allUp' onpointerdown='startAllCurtains(1,this)' onpointerup='stopAllCurtains(this)' onpointercancel='stopAllCurtains(this)' onpointerleave='stopAllCurtains(this)'>â–² ALL UP</button><button class='allDown' onpointerdown='startAllCurtains(2,this)' onpointerup='stopAllCurtains(this)' onpointercancel='stopAllCurtains(this)' onpointerleave='stopAllCurtains(this)'>â–¼ ALL DOWN</button></div></section></body></html>
